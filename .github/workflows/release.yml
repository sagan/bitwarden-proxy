name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests
        run: cargo test --locked --all-targets

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # `cross` provides the musl toolchains inside Docker, so both targets
      # (including the aarch64 one) build on a standard x86_64 runner.
      - uses: taiki-e/install-action@cross

      - name: Build
        run: cross build --locked --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          cp "target/${{ matrix.target }}/release/bitwarden-proxy" \
             "bitwarden-proxy-${{ matrix.target }}"
          chmod +x "bitwarden-proxy-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: bitwarden-proxy-${{ matrix.target }}
          path: bitwarden-proxy-${{ matrix.target }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum bitwarden-proxy-* > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bitwarden-proxy-*
            dist/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  docker:
    name: Publish container image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The release image is assembled from the binaries built above. Artifact
      # uploads do not preserve the executable bit, so set it while preparing
      # the build context. No QEMU is needed because the image only COPYs a
      # prebuilt binary (nothing is executed during the build).
      - name: Prepare Docker build context
        run: |
          mkdir -p docker-context
          install -m 0755 dist/bitwarden-proxy-x86_64-unknown-linux-musl \
            docker-context/bitwarden-proxy-linux-amd64
          install -m 0755 dist/bitwarden-proxy-aarch64-unknown-linux-musl \
            docker-context/bitwarden-proxy-linux-arm64
          ls -l docker-context

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=bitwarden-proxy
            org.opencontainers.image.description=Streaming reverse proxy for Bitwarden servers
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
