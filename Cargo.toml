[package]
name = "bitwarden-proxy"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Streaming reverse proxy for Bitwarden servers that unlocks premium features"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
